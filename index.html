<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0F1C" />
    <meta name="description" content="Documentos legales de Rentia: términos y condiciones, política de privacidad y soporte." />
    <title>Rentia · Información legal</title>
    <script>
      // SPA redirect: si entramos vía 404.html (acceso directo a /terms, /privacy, etc.
      // en hosts estáticos sin rewrites), 404.html guarda la ruta en sessionStorage
      // y redirige a /. Aquí la recuperamos antes de montar React.
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, '', redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
